name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  hassfest:
    name: Hassfest (manifest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master 2026-08-30

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main 2026-08-30
        with:
          category: integration

  # Unit tests moved to ci.yml (job `ci`: pytest + secret scan) on 2026-08-26 so there is ONE test
  # gate that branch protection can require and a deploy workflow could `needs:`. hassfest and HACS
  # validation stay here — the kit does not cover them — and run alongside `ci`, not gated by it.
