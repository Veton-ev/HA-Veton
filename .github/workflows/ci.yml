# CI — Python (installed as .github/workflows/ci.yml by kit/apply.sh --lang python)
#
# Job id is `ci` on purpose: the deploy workflow does `needs: ci` after calling this file via
# `workflow_call`, so a deploy can only start from a SHA this exact job passed on.
# Runs on every push + PR (branch signal before merge) and on workflow_call (from deploy.yml).
#
# veton-ha: Home Assistant custom integration. Tests = pytest (tests/, pytest.ini,
# requirements_test.txt: pytest-homeassistant-custom-component). Lint: ruff is not in the
# requirements, so the lint step prints a ::warning:: SKIPPED — add ruff to requirements_test.txt to enable it.
# Python 3.13 matches what validate.yml used before this file took over the test job; hassfest +
# HACS validation stay in validate.yml (the kit does not cover them).
name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Group includes the CALLER's workflow name: when deploy.yml calls this file via workflow_call,
# github.workflow is "Deploy", so that run never cancels (or is cancelled by) the push-triggered
# "CI" run of the same ref. Plain ci-${{ github.ref }} would make the two fight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.28.0
      GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks scans the whole history (--log-opts=--all)

      # Secret scan FIRST: a leaked credential must fail the job even if the tests are red.
      # Pinned binary + verified checksum, run directly — no gitleaks-action (its org-repo license
      # requirement would leave CI red until someone registers). Whole history is scanned.
      # The verified tarball is cached (key = version + sha256) so the GitHub release download is not
      # a per-run network dependency; on a miss it is fetched with 3 retries. The sha256 is checked on
      # EVERY run, cache hit or miss — a cache entry is never trusted on its own.
      - name: Cache gitleaks (verified tarball)
        id: gitleaks-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/gitleaks/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          key: gitleaks-${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_SHA256 }}

      - name: Secret scan (gitleaks v8.28.0, pinned + sha256-verified)
        env:
          CACHE_HIT: ${{ steps.gitleaks-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          TGZ="$HOME/.cache/gitleaks/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$(dirname "$TGZ")"
          if [ "$CACHE_HIT" = "true" ] && [ -s "$TGZ" ]; then
            echo "gitleaks ${GITLEAKS_VERSION}: tarball from cache"
          else
            URL="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
            rm -f "$TGZ"
            for i in 1 2 3; do
              curl -fsSL --max-time 120 -o "$TGZ" "$URL" && break
              echo "::warning::gitleaks download attempt $i/3 failed"; rm -f "$TGZ"; sleep 5
            done
            [ -s "$TGZ" ] || { echo "::error::gitleaks download failed 3 times: $URL"; exit 1; }
          fi
          echo "${GITLEAKS_SHA256}  $TGZ" | sha256sum -c -
          tar -xzf "$TGZ" -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks git --config .gitleaks.toml --redact --exit-code 1 --no-banner --log-opts="--all" .

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ vars.PYTHON_VERSION || '3.13' }}   # was 3.13 in validate.yml; HA 2024.12+ needs >=3.12
          cache: pip
          cache-dependency-path: requirements_test.txt   # default glob only matches requirements.txt (2026-08-29 fix)

      # The install source is recorded in $GITHUB_ENV (CI_REQ_FILES) so the lint step can check
      # whether `ruff` is part of what this repo asked CI to install.
      - name: Install (requirements-ci.txt → requirements*.txt → pyproject [test])
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          files=""
          if [ -f requirements-ci.txt ]; then
            files="requirements-ci.txt"
          else
            for f in requirements*.txt; do [ -f "$f" ] && files="$files $f"; done
            files="${files# }"
          fi
          if [ -n "$files" ]; then
            for f in $files; do echo "pip install -r $f"; pip install -r "$f"; done
          elif [ -f pyproject.toml ]; then
            echo "no requirements*.txt — pip install -e '.[test]' from pyproject.toml"
            pip install -e '.[test]' || { echo "::warning::'.[test]' extra failed — installing the bare package"; pip install -e .; }
            files="pyproject.toml"
          else
            echo "::warning::no requirements-ci.txt, requirements*.txt or pyproject.toml — nothing installed"
          fi
          echo "CI_REQ_FILES=$files" >> "$GITHUB_ENV"
          echo "install source: ${files:-none}"

      - name: Lint (ruff check when ruff is in the CI requirements)
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086  # CI_REQ_FILES is a space-separated file list on purpose
          if [ -n "${CI_REQ_FILES:-}" ] && grep -qiE '(^|[^a-z0-9_-])ruff([^a-z0-9_-]|$)' $CI_REQ_FILES; then
            ruff --version
            ruff check .
          else
            echo "::warning::SKIPPED lint — 'ruff' is not listed in the CI requirements (searched: ${CI_REQ_FILES:-none}). Add ruff to requirements-ci.txt to enable it."
          fi

      - name: Tests (pytest if a tests dir exists, else compileall)
        run: |
          set -euo pipefail
          if [ -d tests ] || [ -d test ] || [ -f pytest.ini ] || [ -f conftest.py ]; then
            python -c "import pytest" 2>/dev/null || pip install pytest
            python -m pytest -q
          else
            echo "::warning::SKIPPED pytest — no tests/ or test/ dir, pytest.ini or conftest.py; running python -m compileall as a smoke gate only"
            python -m compileall -q .
          fi
